<!doctype html>
<html lang="de" data-version="2">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f2ed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101513" media="(prefers-color-scheme: dark)">
<script>try{var t=localStorage.getItem('spielraum.theme');if(t==='light'||t==='dark'){document.documentElement.dataset.theme=t;document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){m.setAttribute('content',t==='dark'?'#101513':'#f3f2ed')})}}catch(e){}</script>
<meta name="description" content="Dein Monat auf einen Blick: was frei ist, was noch abgeht, wofür Du sparst. Alle Daten bleiben auf Deinem Gerät.">
<title>Spielraum</title>
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="manifest" href="./manifest.webmanifest" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="stylesheet" href="./app.css">
</head>
<body>
<div id="app"><div class="boot">spielraum<span>Dein Monatsplan wird geladen …</span></div></div>
<dialog id="dialog" class="modal" aria-labelledby="dialog-title"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<input id="import-file" type="file" accept="application/json,.json" hidden>
<script type="module" src="./planner-ui.js"></script>
</body>
</html>
